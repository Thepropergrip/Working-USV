name: TPG Rubble PR Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/tpg-rubble-pr-debug.yml"
      - "edm-jobs/tpg_rubble*"
      - "edm-jobs/build_tpg_rubble*"
      - "tools/dcs-edm/**"

permissions:
  contents: read

jobs:
  intact-debug:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BLENDER_URL: "https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip"
      ED_EXPORTER_COMMIT: "5f03ba70ec96ca6ce68028eabc786ecd97f9cf93"
    steps:
      - id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
      - id: blender
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip=Join-Path $env:RUNNER_TEMP "blender.zip"; $dir=Join-Path $env:RUNNER_TEMP "blender"
          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip
          Expand-Archive $zip $dir -Force
          $exe=Get-ChildItem $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if(-not $exe){throw "Blender not found"}
          "BLENDER_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - id: exporter
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $src=Join-Path $env:RUNNER_TEMP "Blender-EDM-Exporter"
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git $src
          git -C $src checkout $env:ED_EXPORTER_COMMIT
          $scripts=Join-Path $env:GITHUB_WORKSPACE ".edm-blender-scripts"; $addons=Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_scene_edm") (Join-Path $addons "io_scene_edm")
          $upper=Join-Path $addons "io_scene_edm\Materials"; $temp=Join-Path $addons "io_scene_edm\__materials_casefix"; $lower=Join-Path $addons "io_scene_edm\materials"
          if(Test-Path $upper){Rename-Item $upper "__materials_casefix"; Rename-Item $temp "materials"}
          if(-not(Test-Path (Join-Path $lower "__init__.py"))){throw "materials normalization failed"}
          if(-not(Test-Path (Join-Path $addons "io_scene_edm\pyedm_311.pyd"))){throw "pyedm_311.pyd missing"}
          "BLENDER_USER_SCRIPTS=$scripts" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - id: export
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "edm-artifacts" | Out-Null
          & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "edm-jobs/tpg_rubble_intact.json" --artifact-dir "edm-artifacts" *>&1 | Tee-Object "edm-artifacts\intact.log"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Write diagnostic summary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "edm-artifacts" | Out-Null
          @"
run_id=${{ github.run_id }}
checkout=${{ steps.checkout.outcome }}
blender=${{ steps.blender.outcome }}
exporter=${{ steps.exporter.outcome }}
export=${{ steps.export.outcome }}
"@ | Set-Content "edm-artifacts\summary.txt"
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpg-rubble-pr-diagnostic
          path: edm-artifacts/**
          if-no-files-found: error
          retention-days: 7
