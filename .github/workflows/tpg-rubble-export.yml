name: TPG Rubble Pile EDM Debug

on:
  push:
    branches:
      - tpg-rubble-pile-v1
    paths:
      - ".github/workflows/tpg-rubble-export.yml"
      - "edm-jobs/tpg_rubble*"
      - "edm-jobs/build_tpg_rubble*"
      - "tools/dcs-edm/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-intact:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BLENDER_VERSION: "4.1.1"
      BLENDER_URL: "https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip"
      ED_EXPORTER_COMMIT: "5f03ba70ec96ca6ce68028eabc786ecd97f9cf93"
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: blender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender.zip"
          $dir = Join-Path $env:RUNNER_TEMP "blender"
          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Blender executable not found." }
          "BLENDER_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - id: exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:RUNNER_TEMP "Blender-EDM-Exporter"
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git $src
          git -C $src checkout $env:ED_EXPORTER_COMMIT
          $scripts = Join-Path $env:GITHUB_WORKSPACE ".edm-blender-scripts"
          $addons = Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force -Path $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_scene_edm") (Join-Path $addons "io_scene_edm")
          $upper = Join-Path $addons "io_scene_edm\Materials"
          $temp = Join-Path $addons "io_scene_edm\__materials_casefix"
          $lower = Join-Path $addons "io_scene_edm\materials"
          if (Test-Path $upper) { Rename-Item $upper "__materials_casefix"; Rename-Item $temp "materials" }
          if (-not (Test-Path (Join-Path $lower "__init__.py"))) { throw "ED material package normalization failed." }
          if (-not (Test-Path (Join-Path $addons "io_scene_edm\pyedm_311.pyd"))) { throw "Official pyedm_311.pyd missing." }
          "BLENDER_USER_SCRIPTS=$scripts" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - id: export
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = Join-Path $env:GITHUB_WORKSPACE "edm-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log = Join-Path $out "intact-export.log"
          & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "edm-jobs/tpg_rubble_intact.json" --artifact-dir "$out" *>&1 | Tee-Object -FilePath $log
          $code=$LASTEXITCODE
          if ($code -ne 0) { throw "EDM export failed with exit code $code" }
      - name: Publish status back to branch
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path "ci-status" | Out-Null
          $status = @"
run_id=${{ github.run_id }}
checkout=${{ steps.checkout.outcome }}
blender=${{ steps.blender.outcome }}
exporter=${{ steps.exporter.outcome }}
export=${{ steps.export.outcome }}
"@
          $log = "edm-artifacts\intact-export.log"
          if (Test-Path $log) { $status += "`n--- LOG TAIL ---`n" + (Get-Content $log -Tail 160 | Out-String) }
          Set-Content -Path "ci-status/rubble-intact.txt" -Value $status -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/rubble-intact.txt
          git commit -m "Record rubble EDM debug status [skip ci]"
          git push origin HEAD:tpg-rubble-pile-v1
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpg-rubble-intact-debug
          path: edm-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
