name: DCS EDM Export (Blender 4.1.1)

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "Path to EDM job JSON"
        required: false
        default: "edm-jobs/job.json"
  pull_request:
    paths:
      - ".github/workflows/dcs-edm-export.yml"
      - "tools/dcs-edm/**"
      - "edm-jobs/**"
  push:
    paths:
      - ".github/workflows/dcs-edm-export.yml"
      - "tools/dcs-edm/**"
      - "edm-jobs/**"

permissions:
  contents: read

jobs:
  export-edm:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      BLENDER_VERSION: "4.1.1"
      BLENDER_URL: "https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip"
      ED_EXPORTER_COMMIT: "5f03ba70ec96ca6ce68028eabc786ecd97f9cf93"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Blender 4.1.1 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender-$env:BLENDER_VERSION.zip"
          $dir = Join-Path $env:RUNNER_TEMP "blender-$env:BLENDER_VERSION"
          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Blender executable not found after extraction." }
          "BLENDER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Blender: $($exe.FullName)"

      - name: Install official Eagle Dynamics EDM exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:RUNNER_TEMP "Blender-EDM-Exporter"
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git $src
          git -C $src checkout $env:ED_EXPORTER_COMMIT

          $scripts = Join-Path $env:GITHUB_WORKSPACE ".edm-blender-scripts"
          $addons = Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force -Path $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_scene_edm") (Join-Path $addons "io_scene_edm")

          # The official v261289 addon ships the package directory as "Materials"
          # while importing it as lower-case "materials". Normal interactive Windows
          # installs tolerate this, but Blender's headless import path on the hosted
          # runner does not. Keep ED's original tree untouched and add a case-normalized
          # duplicate in the temporary installation.
          $materialsUpper = Join-Path $addons "io_scene_edm\Materials"
          $materialsTemp  = Join-Path $addons "io_scene_edm\__materials_casefix"
          $materialsLower = Join-Path $addons "io_scene_edm\materials"
          if (Test-Path $materialsUpper) {
            Rename-Item -Path $materialsUpper -NewName "__materials_casefix"
            Rename-Item -Path $materialsTemp -NewName "materials"
          }
          if (-not (Test-Path (Join-Path $materialsLower "__init__.py"))) {
            throw "Failed to normalize ED Materials package casing."
          }

          $native = Join-Path $addons "io_scene_edm\pyedm_311.pyd"
          if (-not (Test-Path $native)) { throw "Official native pyedm_311.pyd was not installed." }

          "BLENDER_USER_SCRIPTS=$scripts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EDM_EXPORTER_COMMIT=$env:ED_EXPORTER_COMMIT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Official ED exporter pinned at $env:ED_EXPORTER_COMMIT"

      - name: Export EDM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "edm-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $isTpg = ("${{ github.event_name }}" -eq "pull_request" -and "${{ github.head_ref }}" -eq "tpg-gas-station")
          if ($isTpg) {
            foreach ($job in @("edm-jobs/tpg_station_intact.json","edm-jobs/tpg_station_lod1.json","edm-jobs/tpg_station_lod2.json","edm-jobs/tpg_station_destroyed.json")) {
              & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "$job" --artifact-dir "$out"
              if ($LASTEXITCODE -ne 0) { throw "TPG station EDM export failed for $job with exit code $LASTEXITCODE" }
            }
            & "edm-jobs/package_tpg_station.ps1"
            if ($LASTEXITCODE -ne 0) { throw "TPG station packaging failed with exit code $LASTEXITCODE" }
          }
          else {
            $requested = ""
            if ("${{ github.event_name }}" -eq "workflow_dispatch") { $requested = "${{ inputs.job_path }}" }
            if ($requested -and (Test-Path $requested)) { $job = $requested }
            elseif (Test-Path "edm-jobs/job.json") { $job = "edm-jobs/job.json" }
            else { $job = "tools/dcs-edm/selftest-job.json" }

            & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "$job" --artifact-dir "$out"
            if ($LASTEXITCODE -ne 0) { throw "Blender/EDM export failed with exit code $LASTEXITCODE" }
          }

          $edm = Get-ChildItem -Path $out -Filter *.edm -File
          if (-not $edm) { throw "Exporter completed without producing an EDM file." }
          $edm | ForEach-Object { Write-Host "EDM artifact: $($_.Name) ($($_.Length) bytes)" }

      - name: Upload EDM build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dcs-edm-${{ github.run_number }}
          path: edm-artifacts/**
          if-no-files-found: error
          retention-days: 30
