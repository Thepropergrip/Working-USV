name: DCS Shelter Native Tooling
on:
  push:
    paths: [".github/workflows/dcs-edm-export.yml", "edm-jobs/**", "tools/dcs-edm/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-edm:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "4.1.1"
      ED_EXPORTER_COMMIT: "5f03ba70ec96ca6ce68028eabc786ecd97f9cf93"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Blender and official EDM exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender-4.1.1.zip"
          Invoke-WebRequest "https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip" -OutFile $zip
          $dir = Join-Path $env:RUNNER_TEMP "blender-4.1.1"
          Expand-Archive $zip $dir -Force
          $exe = Get-ChildItem $dir -Filter blender.exe -Recurse | Select-Object -First 1
          "BLENDER_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $src = Join-Path $env:RUNNER_TEMP "Blender-EDM-Exporter"
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git $src
          git -C $src checkout $env:ED_EXPORTER_COMMIT
          $scripts = Join-Path $env:GITHUB_WORKSPACE ".edm-blender-scripts"
          $addons = Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_scene_edm") (Join-Path $addons "io_scene_edm")
          $upper = Join-Path $addons "io_scene_edm\Materials"
          if (Test-Path $upper) {
            Rename-Item $upper "__materials_casefix"
            Rename-Item (Join-Path $addons "io_scene_edm\__materials_casefix") "materials"
          }
          if (-not (Test-Path (Join-Path $addons "io_scene_edm\pyedm_311.pyd"))) { throw "Native binding missing" }
          "BLENDER_USER_SCRIPTS=$scripts" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EDM_EXPORTER_COMMIT=$env:ED_EXPORTER_COMMIT" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Acquire tooling and run native selftest
        shell: pwsh
        run: |
          & $env:BLENDER_EXE --background --python tools/dcs-edm/export_job.py -- --job edm-jobs/job.json --artifact-dir edm-artifacts
          if ($LASTEXITCODE -ne 0) { throw "Tool acquisition failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: shelter-tools-linux-${{ github.run_number }}
          path: edm-artifacts/blender-linux.tar.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: shelter-tools-windows-${{ github.run_number }}
          path: edm-artifacts/blender-windows.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: shelter-tools-exporter-${{ github.run_number }}
          path: |
            edm-artifacts/edm-addon.zip
            edm-artifacts/*.py
            edm-artifacts/*.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: shelter-tools-runtime-${{ github.run_number }}
          path: edm-artifacts/debs/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
