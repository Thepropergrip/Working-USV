name: TPG Dirt Road Matte Seam Fix Export

on:
  push:
    paths:
      - ".github/workflows/dcs-ground109-road-matte-seamfix.yml"
      - "edm-jobs/build_tpg_ground109_road_windingfix.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-road-set:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      BLENDER_VERSION: "4.1.1"
      BLENDER_URL: "https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip"
      ED_EXPORTER_COMMIT: "5f03ba70ec96ca6ce68028eabc786ecd97f9cf93"
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender 4.1.1 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender-$env:BLENDER_VERSION.zip"
          $dir = Join-Path $env:RUNNER_TEMP "blender-$env:BLENDER_VERSION"
          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Blender executable not found" }
          "BLENDER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify exact Ground109 source maps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "Ground109_2K-PNG.zip"
          $out = Join-Path $env:GITHUB_WORKSPACE "edm-jobs\ground109_road_textures"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Invoke-WebRequest -Uri "https://ambientcg.com/get?file=Ground109_2K-PNG.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $checks = @{
            "Ground109_2K-PNG_Color.png" = "cc6994e4b067f6a8c2e69d11149f35a03ae3d85ffe465244821612a4920e7af0"
            "Ground109_2K-PNG_NormalGL.png" = "58f3c42b1902d207d66d517b4b4d413c5f07ccc53293c3196ba53c3d921459c5"
            "Ground109_2K-PNG_AmbientOcclusion.png" = "c7ce09f22ca0771c6510710aa7ff51eaaf88afa3dcf0c0833c3b3ec5e26029c0"
            "Ground109_2K-PNG_Roughness.png" = "fd987e25b86221e30fa730e0906293b1060a77119a917c0a3b8351b48229a4d7"
          }
          foreach ($name in $checks.Keys) {
            $path = Join-Path $out $name
            if (-not (Test-Path $path)) { throw "Missing exact texture map: $name" }
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($hash -ne $checks[$name]) { throw "Texture mismatch for ${name}: $hash" }
          }

      - name: Install official Eagle Dynamics EDM exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:RUNNER_TEMP "Blender-EDM-Exporter"
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git $src
          git -C $src checkout $env:ED_EXPORTER_COMMIT
          $scripts = Join-Path $env:GITHUB_WORKSPACE ".edm-blender-scripts"
          $addons = Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force -Path $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_scene_edm") (Join-Path $addons "io_scene_edm")
          $upper = Join-Path $addons "io_scene_edm\Materials"
          $tmp = Join-Path $addons "io_scene_edm\__materials_casefix"
          if (Test-Path $upper) {
            Rename-Item -Path $upper -NewName "__materials_casefix"
            Rename-Item -Path $tmp -NewName "materials"
          }
          "BLENDER_USER_SCRIPTS=$scripts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Export all 9 v1.0.3 road pieces
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:GITHUB_WORKSPACE "edm-artifacts"
          $final = Join-Path $root "road-set"
          New-Item -ItemType Directory -Force -Path $final | Out-Null
          $variants = @(
            @{ kind="straight"; len="15";  tag="15FT"; output="TPG_DIRT_SINGLE_LANE_15FT.edm" },
            @{ kind="straight"; len="30";  tag="30FT"; output="TPG_DIRT_SINGLE_LANE_30FT.edm" },
            @{ kind="straight"; len="50";  tag="50FT"; output="TPG_DIRT_SINGLE_LANE_50FT.edm" },
            @{ kind="straight"; len="100"; tag="100FT"; output="TPG_DIRT_SINGLE_LANE_100FT.edm" },
            @{ kind="straight"; len="500"; tag="500FT"; output="TPG_DIRT_SINGLE_LANE_500FT.edm" },
            @{ kind="t"; len="30"; tag="T_JUNCTION"; output="TPG_DIRT_SINGLE_LANE_T_JUNCTION.edm" },
            @{ kind="right"; len="30"; tag="RIGHT_TURN"; output="TPG_DIRT_SINGLE_LANE_RIGHT_TURN.edm" },
            @{ kind="left"; len="30"; tag="LEFT_TURN"; output="TPG_DIRT_SINGLE_LANE_LEFT_TURN.edm" },
            @{ kind="intersection"; len="30"; tag="INTERSECTION"; output="TPG_DIRT_SINGLE_LANE_INTERSECTION.edm" }
          )
          foreach ($v in $variants) {
            $env:ROAD_KIND = $v.kind
            $env:ROAD_LENGTH_FT = $v.len
            $env:ROAD_TAG = $v.tag
            $job = Join-Path $env:RUNNER_TEMP ("road-job-" + $v.tag + ".json")
            $work = Join-Path $root $v.tag
            New-Item -ItemType Directory -Force -Path $work | Out-Null
            $jobObj = @{ mode="script"; script="edm-jobs/build_tpg_ground109_road_windingfix.py"; output=$v.output; save_blend=$false }
            $jobObj | ConvertTo-Json | Set-Content -Path $job -Encoding UTF8
            & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "$job" --artifact-dir "$work"
            if ($LASTEXITCODE -ne 0) { throw "EDM export failed for $($v.tag)" }
            $edm = Join-Path $work $v.output
            if (-not (Test-Path $edm)) { throw "Missing exported EDM: $edm" }
            Copy-Item -Force $edm (Join-Path $final $v.output)
          }
          Copy-Item -Force (Join-Path $env:GITHUB_WORKSPACE "edm-jobs\ground109_road_textures\TPG_Ground109_RoughMet.png") (Join-Path $final "TPG_Ground109_RoughMet.png")
          $count = (Get-ChildItem -Path $final -Filter *.edm).Count
          if ($count -ne 9) { throw "Expected 9 EDM files, got $count" }
          Get-ChildItem $final | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: tpg-dirt-single-lane-road-set-v103-matte-seamfix
          path: edm-artifacts/road-set/*
          if-no-files-found: error
          retention-days: 30
