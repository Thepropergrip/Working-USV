name: Build TPG 10ft Container EDM

on:
  push:
    branches:
      - container-edm-build-20260908
    paths:
      - ".github/workflows/dcs-container-export.yml"
      - "edm-jobs/build_container_10ft_lite.py"
      - "container-build-payload/**"
      - "edm-jobs/container_10ft_lite_job.json"
      - "edm-jobs/container-mod/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      BLENDER_VERSION: "4.1.1"
      BLENDER_URL: "https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip"
      ED_EXPORTER_COMMIT: "5f03ba70ec96ca6ce68028eabc786ecd97f9cf93"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Blender 4.1.1 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender-$env:BLENDER_VERSION.zip"
          $dir = Join-Path $env:RUNNER_TEMP "blender-$env:BLENDER_VERSION"
          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Blender executable not found after extraction." }
          "BLENDER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Blender: $($exe.FullName)"

      - name: Install official Eagle Dynamics EDM exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:RUNNER_TEMP "Blender-EDM-Exporter"
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git $src
          git -C $src checkout $env:ED_EXPORTER_COMMIT

          $scripts = Join-Path $env:GITHUB_WORKSPACE ".edm-blender-scripts"
          $addons = Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force -Path $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_scene_edm") (Join-Path $addons "io_scene_edm")

          $materialsUpper = Join-Path $addons "io_scene_edm\Materials"
          $materialsTemp  = Join-Path $addons "io_scene_edm\__materials_casefix"
          $materialsLower = Join-Path $addons "io_scene_edm\materials"
          if (Test-Path $materialsUpper) {
            Rename-Item -Path $materialsUpper -NewName "__materials_casefix"
            Rename-Item -Path $materialsTemp -NewName "materials"
          }
          if (-not (Test-Path (Join-Path $materialsLower "__init__.py"))) {
            throw "Failed to normalize ED Materials package casing."
          }

          $native = Join-Path $addons "io_scene_edm\pyedm_311.pyd"
          if (-not (Test-Path $native)) { throw "Official native pyedm_311.pyd was not installed." }

          "BLENDER_USER_SCRIPTS=$scripts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EDM_EXPORTER_COMMIT=$env:ED_EXPORTER_COMMIT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Export native EDM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "edm-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "edm-jobs/container_10ft_lite_job.json" --artifact-dir "$out"
          if ($LASTEXITCODE -ne 0) { throw "Blender/EDM export failed with exit code $LASTEXITCODE" }
          $edm = Join-Path $out "TPG_10FT_CONTAINER_OPEN_LITE.edm"
          if (-not (Test-Path $edm)) { throw "EDM exporter completed without expected file: $edm" }
          $size = (Get-Item $edm).Length
          if ($size -lt 10000) { throw "EDM output is suspiciously small: $size bytes" }
          Write-Host "Native EDM created: $edm ($size bytes)"

      - name: Package drop-in DCS Tech mod
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "edm-artifacts"
          $modRoot = Join-Path $artifactRoot "TPG_10FT_CONTAINER_OPEN_LITE"
          $shapes = Join-Path $modRoot "Shapes"
          $db = Join-Path $modRoot "Database"
          $textures = Join-Path $modRoot "Textures"
          New-Item -ItemType Directory -Force -Path $shapes, $db, $textures | Out-Null

          Copy-Item (Join-Path $artifactRoot "TPG_10FT_CONTAINER_OPEN_LITE.edm") (Join-Path $shapes "TPG_10FT_CONTAINER_OPEN_LITE.edm") -Force
          Copy-Item "edm-jobs/container-mod/entry.lua" (Join-Path $modRoot "entry.lua") -Force
          Copy-Item "edm-jobs/container-mod/db_objects.lua" (Join-Path $db "db_objects.lua") -Force
          Copy-Item "edm-jobs/container-mod/README.txt" (Join-Path $modRoot "README.txt") -Force
          Copy-Item (Join-Path $artifactRoot "TPG_Container_Base.png") (Join-Path $textures "TPG_Container_Base.png") -Force
          Copy-Item (Join-Path $artifactRoot "TPG_Container_RoughMet.png") (Join-Path $textures "TPG_Container_RoughMet.png") -Force
          Copy-Item (Join-Path $artifactRoot "TPG_Container_Normal.png") (Join-Path $textures "TPG_Container_Normal.png") -Force

          $zip = Join-Path $artifactRoot "TPG_10FT_CONTAINER_OPEN_LITE_DCS_DropIn.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $modRoot -DestinationPath $zip -CompressionLevel Optimal
          $zipSize = (Get-Item $zip).Length
          Write-Host "Drop-in package: $zip ($zipSize bytes)"

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: TPG-10FT-CONTAINER-OPEN-LITE-${{ github.run_number }}
          path: |
            edm-artifacts/TPG_10FT_CONTAINER_OPEN_LITE_DCS_DropIn.zip
            edm-artifacts/TPG_10FT_CONTAINER_OPEN_LITE.edm
            edm-artifacts/TPG_10FT_CONTAINER_OPEN_LITE.blend
            edm-artifacts/edm-build-report.json
            edm-artifacts/TPG_Container_Base.png
            edm-artifacts/TPG_Container_RoughMet.png
            edm-artifacts/TPG_Container_Normal.png
          if-no-files-found: error
          retention-days: 30
