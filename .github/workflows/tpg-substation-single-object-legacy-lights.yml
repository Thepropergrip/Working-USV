name: TPG Substation Single Object Legacy Lights

on:
  push:
    branches:
      - tpg-electrical-substation
    paths:
      - ".github/workflows/tpg-substation-single-object-legacy-lights.yml"
      - "edm-jobs/build_tpg_substation.py"
      - "edm-jobs/tpg_substation_common.py"
      - "edm-jobs/build_tpg_substation_*.py"
      - "edm-jobs/tpg_substation_*.json"
      - "edm-jobs/build_tpg_substation_legacy_dynamic_lights.py"
      - "edm-jobs/package_tpg_substation_single_object_legacy_lights.ps1"
      - "tools/dcs-edm/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-substation:
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: intact
            job: edm-jobs/tpg_substation_intact.json
          - variant: lod1
            job: edm-jobs/tpg_substation_lod1.json
          - variant: lod2
            job: edm-jobs/tpg_substation_lod2.json
          - variant: destroyed
            job: edm-jobs/tpg_substation_destroyed.json
    env:
      BLENDER_URL: "https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip"
      ED_EXPORTER_COMMIT: "5f03ba70ec96ca6ce68028eabc786ecd97f9cf93"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender 4.1.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender.zip"
          $dir = Join-Path $env:RUNNER_TEMP "blender"
          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Blender executable not found." }
          "BLENDER_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install official ED exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:RUNNER_TEMP "Blender-EDM-Exporter"
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git $src
          git -C $src checkout $env:ED_EXPORTER_COMMIT
          $scripts = Join-Path $env:GITHUB_WORKSPACE ".edm-blender-scripts"
          $addons = Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force -Path $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_scene_edm") (Join-Path $addons "io_scene_edm")
          $upper = Join-Path $addons "io_scene_edm\Materials"
          $temp = Join-Path $addons "io_scene_edm\__materials_casefix"
          $lower = Join-Path $addons "io_scene_edm\materials"
          if (Test-Path $upper) {
            Rename-Item $upper "__materials_casefix"
            Rename-Item $temp "materials"
          }
          if (-not (Test-Path (Join-Path $lower "__init__.py"))) { throw "ED material package normalization failed." }
          "BLENDER_USER_SCRIPTS=$scripts" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Export ${{ matrix.variant }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "edm-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "${{ matrix.job }}" --artifact-dir "$out"
          if ($LASTEXITCODE -ne 0) { throw "EDM export failed for ${{ matrix.variant }}." }

      - name: Upload ${{ matrix.variant }}
        uses: actions/upload-artifact@v4
        with:
          name: single-lights-substation-${{ matrix.variant }}
          path: edm-artifacts/**
          if-no-files-found: error
          retention-days: 30

  export-legacy-lights:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BLENDER_URL: "https://download.blender.org/release/Blender2.93/blender-2.93.18-windows-x64.zip"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender 2.93.18
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender293.zip"
          $dir = Join-Path $env:RUNNER_TEMP "blender293"
          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Blender 2.93 executable not found." }
          "BLENDER_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install legacy Blender EDM exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:RUNNER_TEMP "legacy-edm-exporter"
          git clone --depth 1 https://github.com/DCS-Creativity/BlenderEdmExporter.git $src
          $scripts = Join-Path $env:GITHUB_WORKSPACE ".legacy-edm-scripts"
          $addons = Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force -Path $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_BlenderEdmExporter") (Join-Path $addons "io_BlenderEdmExporter")
          "BLENDER_USER_SCRIPTS=$scripts" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Export accepted legacy LightNode v1 EDM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "edm-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $edm = Join-Path $out "TPG_Electrical_Substation_V1_LEGACY_DYNAMIC_LIGHTS.edm"
          & $env:BLENDER_EXE --background --python "edm-jobs/build_tpg_substation_legacy_dynamic_lights.py" -- --out "$edm"
          if ($LASTEXITCODE -ne 0) { throw "Legacy light export failed." }
          if (-not (Test-Path $edm)) { throw "Legacy light EDM missing." }

      - name: Upload legacy lights
        uses: actions/upload-artifact@v4
        with:
          name: single-lights-legacy-edm
          path: edm-artifacts/TPG_Electrical_Substation_V1_LEGACY_DYNAMIC_LIGHTS.edm
          if-no-files-found: error
          retention-days: 30

  package:
    needs: [export-substation, export-legacy-lights]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all exported EDMs and textures
        uses: actions/download-artifact@v4
        with:
          pattern: single-lights-*
          path: edm-artifacts
          merge-multiple: true

      - name: Package single selectable LIGHTS asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "edm-jobs/package_tpg_substation_single_object_legacy_lights.ps1"
          if (-not $?) { throw "Packaging failed." }
          $zip = "edm-artifacts\TPG_Electrical_Substation_V1_LIGHTS_DCS_DropIn.zip"
          if (-not (Test-Path $zip)) { throw "Final DCS ZIP missing." }
          Get-Item $zip | ForEach-Object { Write-Host "FINAL PACKAGE: $($_.FullName) $($_.Length) bytes" }

      - name: Upload final single-object LIGHTS package
        uses: actions/upload-artifact@v4
        with:
          name: TPG-Electrical-Substation-V1-LIGHTS-SINGLE-OBJECT-DCS-DropIn
          path: |
            edm-artifacts/TPG_Electrical_Substation_V1_LIGHTS_DCS_DropIn.zip
            edm-artifacts/TPG_Electrical_Substation_V1_LIGHTS/**
          if-no-files-found: error
          retention-days: 30
