name: MAGURA HR5L Livery Material Export

on:
  push:
    paths:
      - ".github/workflows/magura-livery-export.yml"
      - "edm-jobs/magura_livery_material_split.py"
      - "edm-jobs/magura_livery_intact_job.json"
      - "edm-jobs/magura_livery_destroyed_job.json"

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "4.1.1"
      BLENDER_URL: "https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip"
      ED_EXPORTER_COMMIT: "5f03ba70ec96ca6ce68028eabc786ecd97f9cf93"
    steps:
      - uses: actions/checkout@v4

      - name: Download verified V5 visual artifact
        uses: actions/download-artifact@v4
        with:
          name: magura-aim9x-360-hires-12
          path: v5-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Thepropergrip/Working-USV
          run-id: 33933261470

      - name: Verify exact V5 intact blend exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $blend = "v5-artifact/MAGURA_W6_SeaDragon_AIM9X_360_HiRes.blend"
          if (-not (Test-Path $blend)) { throw "Verified V5 blend missing." }
          Write-Host "V5_BLEND_SHA256=$((Get-FileHash -Algorithm SHA256 $blend).Hash.ToLower())"

      - name: Install Blender 4.1.1 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender-$env:BLENDER_VERSION.zip"
          $dir = Join-Path $env:RUNNER_TEMP "blender-$env:BLENDER_VERSION"
          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Blender executable not found." }
          "BLENDER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install official Eagle Dynamics EDM exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:RUNNER_TEMP "Blender-EDM-Exporter"
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git $src
          git -C $src checkout $env:ED_EXPORTER_COMMIT
          $scripts = Join-Path $env:GITHUB_WORKSPACE ".edm-blender-scripts"
          $addons = Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force -Path $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_scene_edm") (Join-Path $addons "io_scene_edm")
          $upper = Join-Path $addons "io_scene_edm/Materials"
          $temp  = Join-Path $addons "io_scene_edm/__materials_casefix"
          if (Test-Path $upper) {
            Rename-Item -Path $upper -NewName "__materials_casefix"
            Rename-Item -Path $temp -NewName "materials"
          }
          $native = Join-Path $addons "io_scene_edm/pyedm_311.pyd"
          if (-not (Test-Path $native)) { throw "Official native pyedm_311.pyd missing." }
          "BLENDER_USER_SCRIPTS=$scripts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Split fiberglass-top material and export intact EDM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "livery-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "edm-jobs/magura_livery_intact_job.json" --artifact-dir "$out"
          if ($LASTEXITCODE -ne 0) { throw "HR5L intact export failed." }
          if (-not (Test-Path "$out/MAGURA_W6_SeaDragon_AIM9X_360_HR5L.edm")) { throw "HR5L intact EDM missing." }
          if (-not (Test-Path "$out/MAGURA_W6_SeaDragon_AIM9X_360_HR5L.blend")) { throw "HR5L patched blend missing." }
          if (-not (Test-Path "magura-livery-material-qa.json")) { throw "Material QA missing." }
          $qa = Get-Content "magura-livery-material-qa.json" -Raw | ConvertFrom-Json
          if ($qa.status -ne "success") { throw "Material QA failed." }
          if ($qa.functional_transform_max_delta -ne 0) { throw "Functional transform changed." }
          if ($qa.bow_fairing_forced_black_material.Count -lt 2) { throw "Bow fairing black-material QA failed." }

      - name: Export destroyed EDM from same material-split blend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "livery-artifacts"
          & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "edm-jobs/magura_livery_destroyed_job.json" --artifact-dir "$out"
          if ($LASTEXITCODE -ne 0) { throw "HR5L destroyed export failed." }
          if (-not (Test-Path "$out/MAGURA_W6_SeaDragon_AIM9X_360_HR5L_destroyed.edm")) { throw "HR5L destroyed EDM missing." }

      - name: Stage QA
        shell: pwsh
        run: |
          Copy-Item -Force "magura-livery-material-qa.json" "livery-artifacts/material-qa.json"
          $hashes = Get-ChildItem "livery-artifacts" -File | ForEach-Object {
            [pscustomobject]@{file=$_.Name; bytes=$_.Length; sha256=(Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()}
          }
          $hashes | ConvertTo-Json -Depth 4 | Out-File "livery-artifacts/artifact-hashes.json" -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: magura-hr5l-material-export
          path: livery-artifacts/**
          if-no-files-found: error
          retention-days: 30
