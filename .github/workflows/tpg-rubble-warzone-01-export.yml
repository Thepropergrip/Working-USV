name: TPG Rubble Warzone 01 Parallel EDM Build

on:
  push:
    branches:
      - tpg-rubble-warzone-01
    paths:
      - ".github/workflows/tpg-rubble-warzone-01-export.yml"
      - "edm-jobs/build_tpg_rubble_warzone_01.py"
      - "edm-jobs/package_tpg_rubble_warzone_01.ps1"
      - "tools/dcs-edm/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tpg-rubble-warzone-01-export.yml"
      - "edm-jobs/build_tpg_rubble_warzone_01.py"
      - "edm-jobs/package_tpg_rubble_warzone_01.ps1"
      - "tools/dcs-edm/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-rubble:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: intact
            output: TPG_Warzone_Rubble_Pile_01.edm
            save_blend: true
          - variant: lod1
            output: TPG_Warzone_Rubble_Pile_01_LOD1.edm
            save_blend: false
          - variant: lod2
            output: TPG_Warzone_Rubble_Pile_01_LOD2.edm
            save_blend: false
          - variant: destroyed
            output: TPG_Warzone_Rubble_Pile_01_Destroyed.edm
            save_blend: true

    env:
      BLENDER_VERSION: "4.1.1"
      BLENDER_URL: "https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip"
      ED_EXPORTER_COMMIT: "5f03ba70ec96ca6ce68028eabc786ecd97f9cf93"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender 4.1.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "blender.zip"
          $dir = Join-Path $env:RUNNER_TEMP "blender"
          Invoke-WebRequest -Uri $env:BLENDER_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter blender.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Blender executable not found." }
          "BLENDER_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Blender: $($exe.FullName)"

      - name: Install official ED EDM exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:RUNNER_TEMP "Blender-EDM-Exporter"
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git $src
          git -C $src checkout $env:ED_EXPORTER_COMMIT

          $scripts = Join-Path $env:GITHUB_WORKSPACE ".edm-blender-scripts"
          $addons = Join-Path $scripts "addons"
          New-Item -ItemType Directory -Force -Path $addons | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src "io_scene_edm") (Join-Path $addons "io_scene_edm")

          $upper = Join-Path $addons "io_scene_edm\Materials"
          $temp = Join-Path $addons "io_scene_edm\__materials_casefix"
          $lower = Join-Path $addons "io_scene_edm\materials"
          if (Test-Path $upper) {
            Rename-Item $upper "__materials_casefix"
            Rename-Item $temp "materials"
          }

          if (-not (Test-Path (Join-Path $lower "__init__.py"))) { throw "ED material package normalization failed." }
          if (-not (Test-Path (Join-Path $addons "io_scene_edm\pyedm_311.pyd"))) { throw "Official pyedm_311.pyd missing." }

          "BLENDER_USER_SCRIPTS=$scripts" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EDM_EXPORTER_COMMIT=$env:ED_EXPORTER_COMMIT" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build export job
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $save = [System.Convert]::ToBoolean("${{ matrix.save_blend }}")
          $job = @{
            mode = "script"
            script = "edm-jobs/build_tpg_rubble_warzone_01.py"
            output = "${{ matrix.output }}"
            save_blend = $save
          } | ConvertTo-Json
          Set-Content -Path "edm-jobs/tpg_rubble_runtime_job.json" -Value $job -Encoding UTF8
          Write-Host $job

      - name: Export ${{ matrix.variant }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:TPG_RUBBLE_VARIANT = "${{ matrix.variant }}"
          $out = Join-Path $env:GITHUB_WORKSPACE "edm-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          & $env:BLENDER_EXE --background --python "tools/dcs-edm/export_job.py" -- --job "edm-jobs/tpg_rubble_runtime_job.json" --artifact-dir "$out"
          if ($LASTEXITCODE -ne 0) { throw "EDM export failed for ${{ matrix.variant }}." }

          $edm = Join-Path $out "${{ matrix.output }}"
          if (-not (Test-Path $edm)) { throw "Expected EDM missing: $edm" }
          if ((Get-Item $edm).Length -le 0) { throw "Expected EDM is empty: $edm" }
          Get-Item $edm | ForEach-Object { Write-Host "EDM artifact: $($_.Name) $($_.Length) bytes" }

      - name: Upload ${{ matrix.variant }}
        uses: actions/upload-artifact@v4
        with:
          name: tpg-rubble-${{ matrix.variant }}
          path: edm-artifacts/**
          if-no-files-found: error
          retention-days: 30

  package-rubble:
    needs: export-rubble
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exported variants
        uses: actions/download-artifact@v4
        with:
          pattern: tpg-rubble-*
          path: edm-artifacts
          merge-multiple: true

      - name: Package DCS drop-in
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "edm-jobs/package_tpg_rubble_warzone_01.ps1"
          if (-not $?) { throw "Packaging failed." }
          $zip = "edm-artifacts\TPG_Warzone_Rubble_Pile_01_DCS_DropIn.zip"
          if (-not (Test-Path $zip)) { throw "Final DCS ZIP missing." }
          Get-Item $zip | ForEach-Object { Write-Host "FINAL PACKAGE: $($_.FullName) $($_.Length) bytes" }

      - name: Upload final DCS package
        uses: actions/upload-artifact@v4
        with:
          name: TPG-Warzone-Rubble-Pile-01-DCS-DropIn
          path: |
            edm-artifacts/TPG_Warzone_Rubble_Pile_01_DCS_DropIn.zip
            edm-artifacts/TPG_Warzone_Rubble_Pile_01/**
          if-no-files-found: error
          retention-days: 30
